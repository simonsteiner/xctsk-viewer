[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True

# Allow missing imports for third-party modules
[mypy.plugins.flask.*]
follow_imports = skip

[mypy.plugins.werkzeug.*]
follow_imports = skip

[mypy.plugins.pyxctsk.*]
follow_imports = skip

# Allow missing imports for these specific modules
[mypy-flask.*]
ignore_missing_imports = True

[mypy-werkzeug.*]
ignore_missing_imports = True

[mypy-pyxctsk.*]
ignore_missing_imports = True

# zxing-cpp 3.1.0 ships a stub with `None = 0` enum members that mypy cannot parse.
# Skipping the top-level module stops mypy descending into the offending
# zxingcpp.zxingcpp submodule stub (and covers the py.typed root package).
[mypy-zxingcpp]
follow_imports = skip
ignore_missing_imports = True

[mypy-urllib3.*]
ignore_missing_imports = True

[mypy-qrcode.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True
