[build-system]
requires = ["setuptools>=80.9", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xctsk-viewer"
version = "0.1.0"
description = "A Python-based interactive visualization tool for viewing XCTSK files"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Simon Steiner", email = "simonsteiner@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Framework :: Flask",
]
keywords = ["xctsk", "xctask", "paragliding", "visualization", "flask"]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.1",
    "gunicorn>=23.0.0",
    "pillow>=11.3.0",
    "pyxctsk @ git+https://github.com/simonsteiner/pyxctsk",
    "qrcode[pil]>=8.2.0",
    "requests>=2.32.4",
    "umami-analytics>=0.2.20",
]

[dependency-groups]
dev = [
    "lefthook>=1.12.2",
    "mypy>=1.16.1",
    "ruff>=0.12.2",
]

[project.urls]
Repository = "https://github.com/simonsteiner/xctsk-viewer"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes (flake8), I: isort, D: pydocstyle
select = ["E", "F", "I", "D"]
# E501 (line too long) is handled by the formatter; E203 conflicts with it
ignore = ["E501", "E203"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app"]
