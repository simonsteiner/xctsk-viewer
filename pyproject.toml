[build-system]
requires = ["setuptools>=84.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xctsk-viewer"
version = "0.1.0"
description = "A Python-based interactive visualization tool for viewing XCTSK files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Simon Steiner", email = "simonsteiner@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Framework :: Flask",
]
keywords = ["xctsk", "xctask", "paragliding", "visualization", "flask"]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "openair-rs-py>=0.2.1",
    "pillow>=12.3.0",
    "pyxctsk[qr]>=0.7.0",
    "qrcode[pil]>=8.2",
    "requests>=2.34.2",
    "umami-analytics>=1.0.0",
]

[dependency-groups]
dev = [
    "lefthook>=2.1.16",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "rumdl>=0.2.78",
]

[project.urls]
Repository = "https://github.com/simonsteiner/xctsk-viewer"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes (flake8), I: isort, D: pydocstyle
select = ["E", "F", "I", "D"]
# E501 (line too long) is handled by the formatter; E203 conflicts with it
ignore = ["E501", "E203"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Tests don't need the full pydocstyle docstring conventions
"tests/**" = ["D"]
